<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Sounds — Area 2: Feedback Prototype 3</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="prototype">
        <header class="intro">
            <p class="eyebrow">GARDEN OF SOUNDS</p>
            <h1>Feedback Prototype 3</h1>
            <p id="instruction">Tap the flower and watch the garden respond.</p>
        </header>

        <section class="garden" aria-label="Garden canvas">
            <button id="flower" class="flower" type="button"
                    aria-label="Play flower sound" aria-describedby="instruction">
                <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
                    <g fill="currentColor">
                        <circle cx="60" cy="29" r="20" />
                        <circle cx="89" cy="50" r="20" />
                        <circle cx="78" cy="84" r="20" />
                        <circle cx="42" cy="84" r="20" />
                        <circle cx="31" cy="50" r="20" />
                        <circle cx="60" cy="60" r="17" fill="#f7cb5c" />
                    </g>
                </svg>
            </button>
        </section>

        <p id="sound-status" class="sound-status" role="status" aria-atomic="true"></p>
        <noscript>Enable JavaScript to play the flower sound.</noscript>
    </main>
</body>
</html>
