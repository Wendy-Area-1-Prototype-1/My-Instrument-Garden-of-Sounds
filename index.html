<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Sounds - Mapping Prototype 3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="prototype">
        <header class="intro">
            <p class="eyebrow">Area 1 - Garden of Sounds</p>
            <h1>Mapping Prototype 3</h1>
            <p>Drag both objects to control continuous pitch and stereo position.</p>
        </header>

        <button id="play-button" class="play-button" type="button">Play Garden</button>

        <section id="sound-canvas" class="sound-canvas" aria-label="Two-dimensional sound mapping canvas">
            <span class="axis-label axis-label--high" aria-hidden="true">High</span>
            <span class="axis-label axis-label--low" aria-hidden="true">Low</span>
            <span class="axis-label axis-label--left" aria-hidden="true">Left</span>
            <span class="axis-label axis-label--right" aria-hidden="true">Right</span>

            <button class="sound-object sound-object--one" type="button" aria-label="Drag sound object 1">
                <span aria-hidden="true">&#10047;</span>
            </button>
            <button class="sound-object sound-object--two" type="button" aria-label="Drag sound object 2">
                <span aria-hidden="true">&#10048;</span>
            </button>
        </section>

        <section class="testing-info" aria-label="Current sound mapping values">
            <p id="object-one-info"></p>
            <p id="object-two-info"></p>
        </section>
    </main>
</body>
</html>
