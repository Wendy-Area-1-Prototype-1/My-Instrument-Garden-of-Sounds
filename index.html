<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Sounds — Feedback Prototype 1: Object Movement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="prototype">
        <header class="intro">
            <p class="eyebrow">GARDEN OF SOUNDS</p>
            <h1>Feedback Prototype 1</h1>
            <p id="instruction">Tap the flower to play a sound.</p>
        </header>

        <section class="garden" aria-label="Garden canvas">
            <button id="flower" class="flower" type="button"
                    aria-label="Play flower sound" aria-describedby="instruction">
                <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
                    <g fill="#ef788c" stroke="currentColor" stroke-width="2.8">
                        <circle cx="60" cy="29" r="21" />
                        <circle cx="87" cy="45" r="21" />
                        <circle cx="87" cy="76" r="21" />
                        <circle cx="60" cy="91" r="21" />
                        <circle cx="33" cy="76" r="21" />
                        <circle cx="33" cy="45" r="21" />
                        <circle cx="60" cy="60" r="18" fill="#f4ca63" />
                    </g>
                </svg>
            </button>
        </section>

        <p id="sound-status" class="sound-status" role="status" aria-atomic="true"></p>
        <noscript>Enable JavaScript to play the flower sound.</noscript>
    </main>
</body>
</html>
