name: Publish assignment website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and all prototype histories
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch current prototype branches
        run: git fetch origin '+refs/heads/Area1_Prototype*:refs/remotes/origin/Area1_Prototype*'
      - name: Build assignment pages, prototype sites, and commit logs
        run: python3 scripts/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
