name: Build Site

on:
  push:
    branches:
      - main
      - Area1_Prototype1
      - Area1_Prototype2
      - Area1_Prototype3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build site
        run: python scripts/build_site.py --refresh-logs

      - name: Commit and push _site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _site/
          git commit -m "Build site: update prototypes and links" || echo "No changes to commit"
          git push
